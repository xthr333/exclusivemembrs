name: EXM site checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check config.js
          node --check script.js
          node --check songwars.js
          node --check rollout.js
          node --check tools/build.mjs
          node --check tools/check.mjs

      - name: Test link validator regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate site files and links
        run: python3 tools/validate-site.py

      - name: Validate page structure and public snapshot
        run: npm run check

      - name: Build and check deploy output
        run: |
          npm run build
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          test -s dist/_headers

