name: EXM site checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          node --check config.js
          node --check script.js
          node --check songwars.js

      - name: Validate site files and links
        run: |
          python3 - <<'PY'
          import json
          import re
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote

          root = Path(".")
          required = [
              "index.html", "artists.html", "shop.html", "events.html",
              "updates.html", "submit.html", "about.html", "contact.html",
              "style.css", "script.js", "config.js", "updates.json"
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit("Missing required files: " + ", ".join(missing))

          json.loads((root / "updates.json").read_text(encoding="utf-8"))

          class References(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  for key in ("href", "src"):
                      if key in values:
                          self.refs.append(values[key])

          broken = []
          for page in root.glob("*.html"):
              parser = References()
              parser.feed(page.read_text(encoding="utf-8"))
              for ref in parser.refs:
                  if ref.startswith(("http://", "https://", "mailto:", "tel:", "#", "data:", "javascript:")):
                      continue
                  target = unquote(ref.split("#", 1)[0].split("?", 1)[0])
                  if target and not (root / target).exists():
                      broken.append(f"{page}: {ref}")

          if broken:
              raise SystemExit("Broken local references:\n" + "\n".join(broken))

          combined = "\n".join(p.read_text(encoding="utf-8") for p in root.glob("*.html"))
          stale = [r"7 OF 12", r"7 LOCKED", r"8 APPROVED DUOS", r"9 LOCKED", r"3 OPEN", r"38BXBY"]
          hits = [pattern for pattern in stale if re.search(pattern, combined, re.I)]
          if hits:
              raise SystemExit("Stale public SongWars copy found: " + ", ".join(hits))

          print("EXM site checks passed.")
          PY

