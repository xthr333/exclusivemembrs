<section class="roll-section event-spotlight" id="songwars" aria-labelledby="event-title">
  <a class="event-visual event-visual--solo" href="events.html#featured-event" aria-label="{{name}}: {{headline}} details">
    <span class="event-roman" aria-hidden="true">{{posterEdition}}</span>
    <span class="event-stamp">EXM presents</span>
    <span class="event-wordmark">{{posterFirstLine}}<br>{{posterSecondLine}}<span class="red-star" aria-hidden="true">✦</span></span>
    <span class="event-badge">{{posterFormat}}</span>
    <span class="event-floor"><strong>{{posterTagline}}</strong></span>
  </a>
  <div class="event-copy">
    <p class="kicker">{{status}}</p>
    <h2 id="event-title">{{name}}<br><span class="chrome-type">{{headline}}</span></h2>
    <p>{{summary}}</p>
    <div class="buttons">
      <a class="btn" href="events.html#featured-event">Event details</a>
      <a class="btn btn-dark" href="events.html#double-impact">Season III results</a>
    </div>
  </div>
</section>
