<section class="page-hero" id="featured-event">

  <h1>{{name}}<br><span class="chrome-type">{{headline}}</span></h1>
  <p class="section-copy">{{summary}}</p>
  <p class="section-copy">{{interestNote}}</p>
  <div class="buttons">
    <a class="btn" href="{{actionUrl}}">{{actionLabel}}</a>
    <a class="btn btn-dark" href="https://discord.gg/u8DuaKMZqP" target="_blank" rel="noopener noreferrer">Follow the rollout on Discord</a>
    <a class="text-link" href="#double-impact">Season III results</a>
  </div>
  <p class="section-copy">{{judgingNote}} {{communityNote}}</p>
</section>
