<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>EXM://OWNER CONTROL</title><link rel="stylesheet" href="style.css?v=20261107-vibe"><link rel="stylesheet" href="rollout.css?v=20261107-vibe"><meta name="theme-color" content="#08090d"><link rel="canonical" href="https://exclusivemembrs.com/admin"><link rel="icon" href="assets/brand/exm-logo.webp" type="image/webp"><meta property="og:type" content="website"><meta property="og:site_name" content="EXCLUSIVEMEMBRS"><meta property="og:title" content="EXM://OWNER CONTROL"><meta property="og:image" content="https://exclusivemembrs.com/assets/brand/exm-logo.webp"><meta name="twitter:card" content="summary_large_image"></head>
<body><a class="skip-link" href="#main">SKIP TO CONTENT</a><nav class="navbar" aria-label="Main navigation"><a class="brand" href="index.html" aria-label="ExclusiveMembrs home"><img class="nav-mark" src="assets/brand/exm-logo.webp" width="90" height="36" alt=""><span>EXCLUSIVEMEMBRS</span></a><button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-navigation" aria-label="Toggle navigation">MENU +</button><ul class="nav-links" id="main-navigation"><li><a data-page="shop.html" href="shop.html">🛍️ Shop</a></li><li><a data-page="artists.html" href="artists.html">🎧 The Membrs</a></li><li><a data-page="events.html" href="events.html">⚔️ SongWars</a></li><li><a data-page="residency.html" href="residency.html">🏡 Residency</a></li><li><a data-page="studios.html" href="studios.html">📸 W3 Studios</a></li><li class="nav-more"><button class="nav-more-toggle" type="button" aria-expanded="false" aria-controls="more-navigation">MORE +</button><div class="nav-more-menu" id="more-navigation"><a data-page="updates.html" href="updates.html">📡 Updates</a><a data-page="about.html" href="about.html">✦ About EXM</a><a data-page="submit.html" href="submit.html">✨ Submit your work</a><a data-page="contact.html" href="contact.html">💬 Contact</a></div></li></ul></nav><main id="main" class="admin-shell">
<section class="page-hero" style="padding-left:0;padding-right:0"><p class="eyebrow">PRIVATE CONTROL NODE</p><h1>OWNER<br>CONTROL.</h1></section>
<section id="loginPanel" class="admin-panel"><p class="section-label">OWNER LOGIN</p><form id="loginForm" class="form-shell"><div class="field"><label for="loginEmail">EMAIL</label><input id="loginEmail" type="email" autocomplete="username" required></div><div class="field"><label for="loginPassword">PASSWORD</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">LOGIN</button><p id="loginMessage" class="section-copy"></p></form></section>
<section id="controlPanel" class="hidden"><div class="admin-panel"><p class="section-label">SYSTEM STATUS</p><h2 style="margin-top:12px">LIVE UPDATES // NEW TRANSMISSION</h2><form id="updateForm" class="form-shell"><input id="editId" type="hidden"><div class="field"><label for="category">CATEGORY</label><select id="category" required><option value="">SELECT CATEGORY</option><option value="exm">EXM</option><option value="songwars">SONGWARS</option><option value="roster">ROSTER</option><option value="music">MUSIC</option><option value="merch">MERCH</option><option value="events">EVENTS</option></select></div><div class="field"><label for="headline">HEADLINE</label><input id="headline" maxlength="140" required></div><div class="field"><label for="description">DESCRIPTION</label><textarea id="description" maxlength="1500" required></textarea></div><div class="field"><label for="linkText">BUTTON TEXT</label><input id="linkText" maxlength="80"></div><div class="field"><label for="linkUrl">BUTTON LINK</label><input id="linkUrl" maxlength="500" placeholder="shop.html or https://..."></div><div class="field"><label><input id="featured" type="checkbox"> FEATURED</label></div><div class="field"><label><input id="published" type="checkbox" checked> PUBLISHED</label></div><div class="buttons"><button class="btn" type="submit">SAVE TRANSMISSION</button><button id="cancelEdit" class="btn btn-dark" type="button">CLEAR</button></div><p id="adminMessage" class="section-copy"></p></form></div><div class="admin-panel"><div class="buttons" style="justify-content:space-between"><p class="section-label">PUBLISHED / DRAFT TRANSMISSIONS</p><button id="logoutBtn" class="mini-btn" type="button">LOG OUT</button></div><div id="adminList" class="admin-list"></div></div></section></main>
<script src="config.js?v=20261107-vibe"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="script.js?v=20261107-vibe"></script><script>
const db=getEXMClient();const loginPanel=document.getElementById('loginPanel'),controlPanel=document.getElementById('controlPanel'),msg=document.getElementById('adminMessage'),loginMsg=document.getElementById('loginMessage'),form=document.getElementById('updateForm');
function setLoggedIn(on){loginPanel.classList.toggle('hidden',on);controlPanel.classList.toggle('hidden',!on);if(on)loadAdmin();}async function refreshSession(){const{data}=await db.auth.getSession();setLoggedIn(!!data.session);}document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();loginMsg.textContent='AUTHENTICATING...';const{error}=await db.auth.signInWithPassword({email:document.getElementById('loginEmail').value.trim(),password:document.getElementById('loginPassword').value});if(error)loginMsg.textContent=error.message;else{loginMsg.textContent='';setLoggedIn(true);}});document.getElementById('logoutBtn').onclick=async()=>{await db.auth.signOut();setLoggedIn(false);};function clearForm(){form.reset();document.getElementById('editId').value='';document.getElementById('published').checked=true;msg.textContent='';}document.getElementById('cancelEdit').onclick=clearForm;
form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='SAVING...';const id=document.getElementById('editId').value;const payload={category:document.getElementById('category').value,headline:document.getElementById('headline').value.trim(),description:document.getElementById('description').value.trim(),link_text:document.getElementById('linkText').value.trim()||null,link_url:document.getElementById('linkUrl').value.trim()||null,featured:document.getElementById('featured').checked,published:document.getElementById('published').checked};let result=id?await db.from('exm_updates').update(payload).eq('id',id):await db.from('exm_updates').insert(payload);if(result.error)msg.textContent=result.error.message;else{clearForm();msg.textContent='TRANSMISSION SAVED.';await loadAdmin();}});
async function loadAdmin(){const list=document.getElementById('adminList');list.innerHTML='<div class="system-message">LOADING...</div>';const{data,error}=await db.from('exm_updates').select('*').order('created_at',{ascending:false});if(error){list.replaceChildren();const notice=document.createElement('p');notice.className='system-message';notice.textContent=error.message;list.append(notice);return;}list.innerHTML='';(data||[]).forEach(u=>{const row=document.createElement('div');row.className='admin-row';const h=document.createElement('h3');h.textContent=u.headline||'UNTITLED';const p=document.createElement('p');p.className='section-copy';p.textContent=(u.category||'exm').toUpperCase()+' // '+(u.published?'PUBLISHED':'DRAFT')+(u.featured?' // FEATURED':'');const actions=document.createElement('div');actions.className='admin-actions';const edit=document.createElement('button');edit.className='mini-btn';edit.textContent='EDIT';edit.onclick=()=>editUpdate(u);const pub=document.createElement('button');pub.className='mini-btn';pub.textContent=u.published?'UNPUBLISH':'PUBLISH';pub.onclick=()=>toggleField(u.id,'published',!u.published);const feat=document.createElement('button');feat.className='mini-btn';feat.textContent=u.featured?'UNFEATURE':'FEATURE';feat.onclick=()=>toggleField(u.id,'featured',!u.featured);const del=document.createElement('button');del.className='mini-btn danger';del.textContent='DELETE';del.onclick=()=>deleteUpdate(u.id);actions.append(edit,pub,feat,del);row.append(h,p,actions);list.append(row);});if(!data?.length)list.innerHTML='<div class="system-message">NO TRANSMISSIONS.</div>';}
function editUpdate(u){document.getElementById('editId').value=u.id;const category=document.getElementById('category');const validCategories=['songwars','roster','music','merch','events','exm'];const savedCategory=(u.category||'exm').toLowerCase();category.value=validCategories.includes(savedCategory)?savedCategory:'exm';document.getElementById('headline').value=u.headline||'';document.getElementById('description').value=u.description||'';document.getElementById('linkText').value=u.link_text||'';document.getElementById('linkUrl').value=u.link_url||'';document.getElementById('featured').checked=!!u.featured;document.getElementById('published').checked=!!u.published;scrollTo({top:0,behavior:'smooth'});}async function toggleField(id,field,value){const payload={};payload[field]=value;const{error}=await db.from('exm_updates').update(payload).eq('id',id);if(error)alert(error.message);else loadAdmin();}async function deleteUpdate(id){if(!confirm('Delete this transmission?'))return;const{error}=await db.from('exm_updates').delete().eq('id',id);if(error)alert(error.message);else loadAdmin();}if(db){refreshSession();}else{loginMsg.textContent='Owner login is temporarily unavailable. Please reload when your connection is ready.';document.querySelector('#loginForm button').disabled=true;}
</script><script src="rollout.js?v=20261107-vibe"></script></body></html>
